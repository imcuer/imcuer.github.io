<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hugo 后台管理 · imcuer 的矩阵</title>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.css">
<style>
    :root {
        --bg: #0d1117; --panel: #161b22; --border: #30363d;
        --fg: #c9d1d9; --dim: #8b949e; --accent: #58a6ff;
        --green: #3fb950; --red: #f85149; --orange: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.6 "Consolas", "Microsoft YaHei", monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    header h1 { font-size: 15px; color: var(--accent); white-space: nowrap; }
    header .spacer { flex: 1; }
    button { background: #21262d; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover { background: #388bfd; }
    button.danger:hover { border-color: var(--red); color: var(--red); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea { background: #0d1117; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 2px; }

    /* 主体：左侧列表 + 中间预览 + 右侧属性面板 */
    main { flex: 1; display: flex; min-height: 0; }
    #sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar .tabs { display: flex; border-bottom: 1px solid var(--border); }
    #sidebar .tabs button { flex: 1; border: none; border-radius: 0; padding: 8px; background: transparent; color: var(--dim); }
    #sidebar .tabs button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    #sidebar .new-row { padding: 8px; border-bottom: 1px solid var(--border); }
    #sidebar .new-row button { width: 100%; }
    #filelist { flex: 1; overflow-y: auto; }
    .file-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 6px; }
    .file-item:hover { background: #1c2129; }
    .file-item.active { background: #1f2b3d; border-left: 3px solid var(--accent); }
    .file-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .d { font-size: 11px; color: var(--dim); }
    .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--orange); color: var(--orange); flex-shrink: 0; }
    .file-item .del { visibility: hidden; color: var(--dim); border: none; background: none; padding: 0 4px; font-size: 14px; }
    .file-item:hover .del { visibility: visible; }
    .file-item .del:hover { color: var(--red); }

    /* 预览主区域（全窗口） */
    #preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #preview-header { padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    #preview-header button { font-size: 11px; padding: 2px 8px; }
    #preview-frame { flex: 1; border: none; background: var(--bg); }
    #preview-frame.hidden { display: none; }
    #preview-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; text-align: center; padding: 20px; }
    #preview-placeholder.hidden { display: none; }

    /* 右侧属性面板 */
    #props-panel { width: 320px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    #props-panel .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--accent); font-weight: bold; }
    #props-panel .panel-body { flex: 1; overflow-y: auto; padding: 14px; }
    #props-panel .prop-group { margin-bottom: 16px; }
    #props-panel .prop-group label { display: block; margin-bottom: 4px; color: var(--dim); font-size: 11px; }
    #props-panel .prop-group input, #props-panel .prop-group textarea { width: 100%; }
    #props-panel .prop-group textarea { min-height: 80px; resize: vertical; }
    #props-panel .prop-value { font-family: monospace; font-size: 12px; color: var(--fg); background: var(--bg); padding: 4px 8px; border-radius: 4px; word-break: break-all; }
    #props-panel .element-tag { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
    #props-panel .element-tag code { background: var(--bg); padding: 2px 6px; border-radius: 3px; color: var(--accent); }
    #props-panel .actions { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    #props-panel .actions button { flex: 1; }
    #props-panel .empty { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px; }

    /* Front Matter 表单（底部可折叠） */
    #fm-section { height: 0; background: var(--panel); border-top: 1px solid var(--border); overflow: hidden; transition: height .3s; flex-shrink: 0; }
    #fm-section.expanded { height: auto; max-height: 300px; overflow-y: auto; }
    #fm-toggle { padding: 6px 14px; background: var(--panel); border-top: 1px solid var(--border); cursor: pointer; font-size: 12px; color: var(--dim); flex-shrink: 0; }
    #fm-toggle:hover { color: var(--accent); }
    #fm-form { padding: 10px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
    #fm-form .full { grid-column: 1 / -1; }
    #fm-form .chk { display: flex; align-items: center; gap: 6px; padding-top: 16px; }
    #fm-form .chk label { margin: 0; }

    /* Markdown 编辑器（底部可折叠） */
    #editor-section { height: 0; background: var(--panel); border-top: 1px solid var(--border); overflow: hidden; transition: height .3s; flex-shrink: 0; }
    #editor-section.expanded { height: 300px; display: flex; flex-direction: column; }
    #editor-toggle { padding: 6px 14px; background: var(--panel); border-top: 1px solid var(--border); cursor: pointer; font-size: 12px; color: var(--dim); flex-shrink: 0; }
    #editor-toggle:hover { color: var(--accent); }
    #editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #editor { flex: 1; min-height: 0; }

    /* Toast UI Editor 暗色主题适配 */
    .toastui-editor-defaultUI { border: none; background: var(--bg); }
    .toastui-editor-defaultUI-toolbar { background: var(--panel); border-bottom: 1px solid var(--border); }
    .toastui-editor-md-container, .toastui-editor-ww-container { background: var(--bg); }
    .toastui-editor-mode-switch { background: var(--panel) !important; border-top: 1px solid var(--border) !important; }
    .toastui-editor-mode-switch .tab-item { background: var(--panel); color: var(--dim); border-color: var(--border); }
    .toastui-editor-mode-switch .tab-item.active { background: var(--bg); color: var(--accent); }
    .toastui-editor-contents { color: var(--fg); }

    /* 日志面板 */
    #log-panel { height: 140px; background: #010409; border-top: 1px solid var(--border); overflow-y: auto; padding: 8px 14px; font-size: 12px; flex-shrink: 0; }
    #log-panel .line { white-space: pre-wrap; word-break: break-all; }
    #log-panel .src { color: var(--dim); margin-right: 8px; }
    #log-panel .src.publish { color: var(--green); }
    #log-panel .src.preview { color: var(--orange); }
    #log-panel .src.hugo { color: var(--accent); }

    /* 发布弹窗 */
    #modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
    #modal-mask.show { display: flex; }
    #modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; width: 420px; }
    #modal h2 { font-size: 15px; margin-bottom: 14px; color: var(--accent); }
    #modal .row { margin-bottom: 12px; }
    #modal .row input[type=text], #modal .row input[type=password] { width: 100%; }
    #modal .targets { display: flex; gap: 18px; }
    #modal .targets label { display: flex; align-items: center; gap: 6px; color: var(--fg); font-size: 13px; }
    #modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>

<header>
    <h1>🤖 Hugo 后台管理</h1>
    <button id="btn-preview">▶ 本地预览</button>
    <a id="preview-link" href="http://localhost:1313" target="_blank" style="color:var(--dim);font-size:12px;display:none">localhost:1313 ↗</a>
    <div class="spacer"></div>
    <input id="hugo-args" placeholder="hugo 命令参数" style="width:280px">
    <button id="btn-hugo">执行</button>
    <button id="btn-publish" class="primary">🚀 一键发布</button>
</header>

<main>
    <div id="sidebar">
        <div class="tabs">
            <button data-type="post" class="active">文章</button>
            <button data-type="page">页面</button>
        </div>
        <div class="new-row"><button id="btn-new">＋ 新建</button></div>
        <div id="filelist"></div>
    </div>

    <div id="preview-pane">
        <div id="preview-header">
            <span>📄 实时预览 <span id="preview-url"></span></span>
            <div>
                <span style="font-size:11px;color:var(--accent);margin-right:8px">✏️ 编辑模式已启用</span>
                <button onclick="refreshPreview()">🔄 刷新</button>
            </div>
        </div>
        <div id="preview-placeholder">先点击「▶ 本地预览」启动 hugo server<br>然后选择文章即可看到真实渲染效果</div>
        <iframe id="preview-frame" class="hidden"></iframe>
    </div>

    <div id="props-panel">
        <div class="panel-header">🔧 元素属性</div>
        <div class="panel-body">
            <div id="props-empty" class="empty">在预览页面中点击任意元素<br>即可在此编辑其属性</div>
            <div id="props-content" style="display:none">
                <div class="element-tag">标签: <code id="prop-tag">-</code></div>
                <div class="prop-group">
                    <label>文本内容</label>
                    <textarea id="prop-text" placeholder="元素文本内容"></textarea>
                </div>
                <div class="prop-group">
                    <label>类名 (class)</label>
                    <input id="prop-class" placeholder="元素 class 属性">
                </div>
                <div class="prop-group">
                    <label>ID</label>
                    <input id="prop-id" placeholder="元素 id 属性">
                </div>
                <div class="prop-group">
                    <label>样式 (style)</label>
                    <textarea id="prop-style" placeholder="元素 style 属性"></textarea>
                </div>
                <div class="prop-group">
                    <label>HTML 源码</label>
                    <div class="prop-value" id="prop-html">-</div>
                </div>
            </div>
        </div>
        <div class="actions" id="props-actions" style="display:none">
            <button id="btn-prop-save" class="primary">💾 保存修改</button>
            <button id="btn-prop-cancel">取消</button>
        </div>
    </div>
</main>

<div id="fm-toggle">▼ Front Matter 元信息（点击展开）</div>
<div id="fm-section">
    <div id="fm-form">
        <div><label>标题</label><input id="f-title" style="width:100%"></div>
        <div><label>Slug（URL）</label><input id="f-slug" style="width:100%"></div>
        <div><label>日期</label><input id="f-date" style="width:100%" placeholder="2026-10-21T10:00:00+08:00"></div>
        <div class="chk"><input type="checkbox" id="f-draft"><label for="f-draft">草稿</label></div>
        <div class="full"><label>描述</label><input id="f-description" style="width:100%"></div>
        <div><label>分类</label><input id="f-categories" style="width:100%"></div>
        <div><label>标签</label><input id="f-tags" style="width:100%"></div>
        <div><label>封面图</label><input id="f-image" style="width:100%"></div>
        <div class="full"><label>额外 Front Matter</label><input id="f-extra" style="width:100%"></div>
    </div>
</div>

<div id="editor-toggle">▼ Markdown 源码编辑器（点击展开）</div>
<div id="editor-section">
    <div id="editor-wrap"><div id="editor"></div></div>
    <div style="padding:8px 14px;background:var(--panel);border-top:1px solid var(--border)">
        <button id="btn-save" class="primary">💾 保存</button>
        <span id="save-status" style="margin-left:10px;font-size:12px;color:var(--dim)"></span>
    </div>
</div>

<div id="log-panel"></div>

<div id="modal-mask">
    <div id="modal">
        <h2>🚀 发布站点</h2>
        <div class="row targets">
            <label><input type="checkbox" id="pub-server" checked> 自己的服务器（imcuer.com）</label>
            <label><input type="checkbox" id="pub-github"> GitHub Pages</label>
        </div>
        <div class="row" id="row-server-config">
            <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">
                <div><label>服务器地址</label><input type="text" id="pub-host" style="width:100%"></div>
                <div><label>SSH 端口</label><input type="text" id="pub-port" style="width:100%"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
                <div><label>SSH 用户名</label><input type="text" id="pub-user" style="width:100%"></div>
                <div><label>Web 根目录</label><input type="text" id="pub-webroot" style="width:100%"></div>
            </div>
        </div>
        <div class="row" id="row-auth">
            <label style="color:var(--fg)">认证方式</label>
            <div style="display:flex;gap:18px;margin-top:4px">
                <label><input type="radio" name="auth-type" id="auth-key" value="key" checked> SSH 密钥</label>
                <label><input type="radio" name="auth-type" id="auth-pass" value="password"> 密码</label>
            </div>
        </div>
        <div class="row" id="row-keyfile">
            <label>密钥文件路径（留空自动使用默认）</label>
            <input type="text" id="pub-keyfile" placeholder="~/.ssh/id_ed25519" style="width:100%">
        </div>
        <div class="row" id="row-password">
            <label>服务器 SSH 密码（仅本次使用）</label>
            <input type="password" id="pub-password" autocomplete="off">
        </div>
        <div class="row" id="row-commit" style="display:none">
            <label>Git 提交信息</label>
            <input type="text" id="pub-commit" placeholder="更新站点">
        </div>
        <div class="hint">流程：hugo --gc --minify 构建 → 打包上传服务器 / git push</div>
        <div class="actions">
            <button id="pub-cancel">取消</button>
            <button id="pub-go" class="primary">开始发布</button>
        </div>
    </div>
</div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const api = (url, opts) => fetch(url, opts).then(r => r.json());
const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

let currentType = 'post';
let currentFile = null;
let currentSlug = '';
let editor = null;
let previewRunning = false;
let selectedElement = null;

/* ---------- Toast UI Editor ---------- */
function initEditor(content) {
    if (editor) editor.destroy();
    editor = new toastui.Editor({
        el: $('editor'),
        height: '100%',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical',
        theme: 'dark',
        usageStatistics: false,
        toolbarItems: [
            ['heading', 'bold', 'italic', 'strike'],
            ['hr', 'quote'],
            ['ul', 'ol', 'task', 'indent', 'outdent'],
            ['table', 'image', 'link'],
            ['code', 'codeblock'],
        ],
    });
    editor.setMarkdown(content || '');
}

/* ---------- 预览 iframe ---------- */
function updatePreview() {
    const frame = $('preview-frame'), placeholder = $('preview-placeholder'), urlSpan = $('preview-url');
    if (!previewRunning || !currentSlug) {
        frame.classList.add('hidden');
        placeholder.classList.remove('hidden');
        placeholder.innerHTML = previewRunning
            ? '选择一篇内容后显示实时预览'
            : '先点击「▶ 本地预览」启动 hugo server';
        urlSpan.textContent = '';
        return;
    }
    const path = currentType === 'post' ? `/p/${currentSlug}/` : `/${currentSlug}/`;
    const url = `http://localhost:1313${path}?edit=1`;
    frame.src = url;
    urlSpan.textContent = path;
    frame.classList.remove('hidden');
    placeholder.classList.add('hidden');
}

function refreshPreview() {
    const frame = $('preview-frame');
    if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: 'hugo-reload' }, '*');
    }
}

function clearPropsPanel() {
    $('props-empty').style.display = 'block';
    $('props-content').style.display = 'none';
    $('props-actions').style.display = 'none';
    selectedElement = null;
}

/* ---------- 接收 iframe 消息 ---------- */
window.addEventListener('message', function(e) {
    const data = e.data;
    if (!data || !data.type) return;

    if (data.type === 'hugo-edit-ready') {
        console.log('iframe 编辑模式已就绪');
    }
    else if (data.type === 'hugo-element-select' && data.info) {
        selectedElement = data.info;
        $('props-empty').style.display = 'none';
        $('props-content').style.display = 'block';
        $('props-actions').style.display = 'flex';
        $('prop-tag').textContent = data.info.tag;
        $('prop-text').value = data.info.text || '';
        $('prop-class').value = data.info.className || '';
        $('prop-id').value = data.info.id || '';
        $('prop-style').value = data.info.style || '';
        $('prop-html').textContent = data.info.html ? data.info.html.slice(0, 100) + '...' : '-';

        // 如果是 Front Matter 字段，显示提示并同步到表单
        if (data.info.fmField) {
            const fieldNames = {
                'title': '标题',
                'description': '描述',
                'date': '日期',
                'categories': '分类',
                'tags': '标签',
                'readingTime': '阅读时长'
            };
            const fieldName = fieldNames[data.info.fmField] || data.info.fmField;
            showStatus(`📝 这是 Front Matter 字段：${fieldName}，修改后会同步到表单`);

            // 同步到 Front Matter 表单
            if (data.info.fmField === 'title') {
                $('f-title').value = data.info.text.trim();
            } else if (data.info.fmField === 'description') {
                $('f-description').value = data.info.text.trim();
            } else if (data.info.fmField === 'date') {
                // 尝试解析日期文本，转换为 datetime-local 格式
                const dateText = data.info.text.trim();
                // 这里可以根据需要解析日期文本
                console.log('日期字段:', dateText);
            }
        }
        // 如果是站点配置字段，显示提示
        else if (data.info.siteField) {
            const fieldNames = {
                'title': '站点标题',
                'params.sidebar.subtitle': '站点副标题'
            };
            const fieldName = fieldNames[data.info.siteField] || data.info.siteField;
            showStatus(`📝 这是站点配置字段：${fieldName}，修改后会同步到 hugo.toml`);
        }
    }
    else if (data.type === 'hugo-content-updated' && data.html) {
        console.log('主页面收到内容更新:', data.html.slice(0, 100));
        if (!editor) {
            console.error('editor 未初始化');
            return;
        }
        // 用 DOMParser 解析 HTML，只提取文章正文
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.html, 'text/html');
        const articleContent = doc.querySelector('.article-content');
        const articleTitle = doc.querySelector('.article-title');
        let cleanHtml = '';
        if (articleTitle) cleanHtml += articleTitle.outerHTML;
        if (articleContent) cleanHtml += articleContent.outerHTML;
        console.log('提取的 HTML:', cleanHtml.slice(0, 100));
        const turndown = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced', bulletListMarker: '-' });
        // 自定义规则：标题内的链接转成普通文本
        turndown.addRule('headingLink', {
            filter: function(node) {
                return node.nodeName === 'A' && node.parentNode && /^H[1-6]$/.test(node.parentNode.nodeName);
            },
            replacement: function(content) {
                return content;
            }
        });
        const md = turndown.turndown(cleanHtml);
        console.log('转换后的 Markdown:', md.slice(0, 100));
        // 直接替换整个正文
        editor.setMarkdown(md);
        showStatus(`✅ 已同步到源码，正在保存...`);
        // 自动保存到文件（直接用转换后的 md，不从 editor 获取）
        setTimeout(async () => {
            console.log('开始保存文件');
            console.log('保存的 Markdown:', md.slice(0, 100));
            const fm = {
                title: $('f-title').value,
                description: $('f-description').value,
                date: $('f-date').value,
                slug: $('f-slug').value,
                draft: $('f-draft').checked,
                image: $('f-image').value || undefined,
                categories: splitList($('f-categories').value),
                tags: splitList($('f-tags').value)
            };
            const r = await post('/api/save', { path: currentFile, fm, extra: $('f-extra').value, body: md });
            console.log('保存结果:', r);
            if (r.ok) {
                showStatus('✅ 修改已保存到文件，刷新后生效');
                loadList();
            } else {
                showStatus('❌ 保存失败: ' + r.error);
            }
        }, 500);
    }
});

function showStatus(msg) {
    $('save-status').textContent = msg;
    setTimeout(() => { if ($('save-status').textContent === msg) $('save-status').textContent = ''; }, 3000);
}

/* ---------- 属性面板操作 ---------- */
$('btn-prop-save').onclick = async () => {
    if (!selectedElement || !selectedElement.editId) return;

    // 如果是站点配置字段，保存到 hugo.toml
    if (selectedElement.siteField) {
        const text = $('prop-text').value.trim();
        showStatus('✅ 站点配置字段已更新，正在保存到 hugo.toml...');

        // 读取当前配置
        const config = await api('/api/config');
        let content = config.content;

        // 更新配置
        if (selectedElement.siteField === 'title') {
            content = content.replace(/^title\s*=\s*"([^"]*)"/m, `title = "${text}"`);
        } else if (selectedElement.siteField === 'params.sidebar.subtitle') {
            content = content.replace(/^(\s*)subtitle\s*=\s*"([^"]*)"/m, `$1subtitle = "${text}"`);
        }

        // 保存配置
        const r = await post('/api/config', { content });
        if (r.ok) {
            showStatus('✅ 站点配置已保存到 hugo.toml，刷新后生效');
            // 触发重新构建
            setTimeout(() => {
                refreshPreview();
            }, 1000);
        } else {
            showStatus('❌ 保存失败: ' + r.error);
        }
        return;
    }

    // 如果是 Front Matter 字段，只更新 Front Matter，不修改正文
    if (selectedElement.fmField) {
        const text = $('prop-text').value.trim();
        if (selectedElement.fmField === 'title') {
            $('f-title').value = text;
        } else if (selectedElement.fmField === 'description') {
            $('f-description').value = text;
        }
        showStatus('✅ Front Matter 字段已同步到表单，正在保存...');

        // 自动保存到文件（只更新 Front Matter，正文保持不变）
        setTimeout(async () => {
            const fm = {
                title: $('f-title').value,
                description: $('f-description').value,
                date: $('f-date').value,
                slug: $('f-slug').value,
                draft: $('f-draft').checked,
                image: $('f-image').value || undefined,
                categories: splitList($('f-categories').value),
                tags: splitList($('f-tags').value)
            };
            // 从当前文件读取正文，不修改
            const currentContent = await api('/api/file?path=' + encodeURIComponent(currentFile));
            const r = await post('/api/save', { path: currentFile, fm, extra: $('f-extra').value, body: currentContent.body || '' });
            if (r.ok) {
                showStatus('✅ Front Matter 字段已保存到文件，刷新后生效');
                loadList();
                refreshPreview();
            } else {
                showStatus('❌ 保存失败: ' + r.error);
            }
        }, 500);
    } else {
        // 正文内容，提示用 Markdown 编辑器修改
        showStatus('⚠️ 正文内容请在下方 Markdown 编辑器中修改（格式更可靠）');
        $('editor-section').classList.add('show');
    }
};

$('btn-prop-cancel').onclick = () => {
    const frame = $('preview-frame');
    if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: 'hugo-deselect' }, '*');
    }
    clearPropsPanel();
};

/* ---------- Front Matter / 编辑器折叠 ---------- */
$('fm-toggle').onclick = () => {
    const expanded = $('fm-section').classList.toggle('expanded');
    $('fm-toggle').textContent = expanded ? '▲ Front Matter 元信息（点击收起）' : '▼ Front Matter 元信息（点击展开）';
};

$('editor-toggle').onclick = () => {
    const expanded = $('editor-section').classList.toggle('expanded');
    $('editor-toggle').textContent = expanded ? '▲ Markdown 源码编辑器（点击收起）' : '▼ Markdown 源码编辑器（点击展开）';
    // Toast UI Editor 不需要 refresh，它会自动调整大小
};

/* ---------- 日志 ---------- */
const logPanel = $('log-panel');
new EventSource('/api/events').onmessage = e => {
    const { source, line } = JSON.parse(e.data);
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = `<span class="src ${source}">[${source}]</span>${line.replace(/</g, '&lt;')}`;
    logPanel.appendChild(div);
    logPanel.scrollTop = logPanel.scrollHeight;
};

/* ---------- 文件列表 ---------- */
async function loadList() {
    const data = await api('/api/list');
    const items = currentType === 'post' ? data.posts : data.pages;
    $('filelist').innerHTML = '';
    items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'file-item' + (currentFile === it.rel ? ' active' : '');
        div.innerHTML = `<span class="t" title="${it.rel}">${it.title}</span>
            ${it.draft ? '<span class="badge">草稿</span>' : ''}
            <span class="d">${String(it.date).slice(0, 10)}</span>
            <button class="del" title="删除">✕</button>`;
        div.onclick = () => openFile(it.rel);
        div.querySelector('.del').onclick = ev => { ev.stopPropagation(); deleteFile(it); };
        $('filelist').appendChild(div);
    });
}

/* ---------- 打开 / 保存 / 新建 / 删除 ---------- */
async function openFile(rel) {
    const data = await api('/api/file?path=' + encodeURIComponent(rel));
    currentFile = rel;
    const m = rel.match(/content[\\/](?:post|page)[\\/]([^\\/]+)/);
    currentSlug = m ? m[1] : '';
    $('f-title').value = data.fm.title || '';
    $('f-slug').value = data.fm.slug || '';
    $('f-date').value = data.fm.date || '';
    $('f-draft').checked = !!data.fm.draft;
    $('f-description').value = data.fm.description || '';
    $('f-categories').value = (data.fm.categories || []).join(', ');
    $('f-tags').value = (data.fm.tags || []).join(', ');
    $('f-image').value = data.fm.image || '';
    $('f-extra').value = data.extra || '';
    initEditor(data.body || '');
    $('save-status').textContent = rel;
    updatePreview();
    loadList();
    clearPropsPanel();
}

const splitList = s => s.split(/[,，]/).map(x => x.trim()).filter(Boolean);

async function saveFile() {
    if (!currentFile) return;
    const fm = {
        title: $('f-title').value,
        description: $('f-description').value,
        date: $('f-date').value,
        slug: $('f-slug').value,
        draft: $('f-draft').checked,
        image: $('f-image').value || undefined,
        categories: splitList($('f-categories').value),
        tags: splitList($('f-tags').value)
    };
    const r = await post('/api/save', { path: currentFile, fm, extra: $('f-extra').value, body: editor.getMarkdown() });
    $('save-status').textContent = r.ok ? `已保存 ✓ ${new Date().toLocaleTimeString()}` : '保存失败: ' + r.error;
    loadList();
}

async function newFile() {
    const slug = prompt(`新${currentType === 'post' ? '文章' : '页面'}的 slug：`);
    if (!slug) return;
    const title = prompt('标题：', slug) || slug;
    const r = await post('/api/new', { type: currentType, slug, title });
    if (r.error) return alert('新建失败: ' + r.error);
    await loadList();
    openFile(r.rel);
}

async function deleteFile(it) {
    if (!confirm(`确定删除「${it.title}」？`)) return;
    await post('/api/delete', { path: it.rel });
    if (currentFile === it.rel) {
        currentFile = null;
        $('preview-frame').classList.add('hidden');
        $('preview-placeholder').classList.remove('hidden');
        clearPropsPanel();
    }
    loadList();
}

/* ---------- 预览 / hugo 命令 / 发布 ---------- */
$('btn-preview').onclick = async () => {
    const action = previewRunning ? 'stop' : 'start';
    await post('/api/preview', { action });
    previewRunning = !previewRunning;
    $('btn-preview').textContent = previewRunning ? '⏹ 停止预览' : '▶ 本地预览';
    $('preview-link').style.display = previewRunning ? 'inline' : 'none';
    updatePreview();
};

$('btn-hugo').onclick = () => {
    const args = $('hugo-args').value.trim();
    if (args) post('/api/hugo', { args });
};
$('hugo-args').onkeydown = e => { if (e.key === 'Enter') $('btn-hugo').click(); };

const mask = $('modal-mask');

const SERVER_DEFAULTS = { host: '156.233.225.26', port: '58865', user: 'root', webRoot: '/var/www/hugo', authType: 'key', keyFile: '' };
function loadServerConfig() {
    const saved = JSON.parse(localStorage.getItem('hugo-admin-server') || '{}');
    $('pub-host').value = saved.host || SERVER_DEFAULTS.host;
    $('pub-port').value = saved.port || SERVER_DEFAULTS.port;
    $('pub-user').value = saved.user || SERVER_DEFAULTS.user;
    $('pub-webroot').value = saved.webRoot || SERVER_DEFAULTS.webRoot;
    $('pub-keyfile').value = saved.keyFile || '';
    const authType = saved.authType || SERVER_DEFAULTS.authType;
    $(authType === 'password' ? 'auth-pass' : 'auth-key').checked = true;
    toggleAuthRows();
}
function saveServerConfig() {
    localStorage.setItem('hugo-admin-server', JSON.stringify({
        host: $('pub-host').value.trim(),
        port: $('pub-port').value.trim(),
        user: $('pub-user').value.trim(),
        webRoot: $('pub-webroot').value.trim(),
        authType: $('auth-pass').checked ? 'password' : 'key',
        keyFile: $('pub-keyfile').value.trim()
    }));
}
function toggleAuthRows() {
    const isPass = $('auth-pass').checked;
    $('row-keyfile').style.display = isPass ? 'none' : 'block';
    $('row-password').style.display = isPass ? 'block' : 'none';
}

$('btn-publish').onclick = () => { loadServerConfig(); mask.classList.add('show'); };
$('pub-cancel').onclick = () => mask.classList.remove('show');
$('pub-server').onchange = e => {
    const show = e.target.checked ? 'block' : 'none';
    $('row-server-config').style.display = show;
    $('row-auth').style.display = show;
    toggleAuthRows();
};
$('auth-key').onchange = toggleAuthRows;
$('auth-pass').onchange = toggleAuthRows;
$('pub-github').onchange = e => $('row-commit').style.display = e.target.checked ? 'block' : 'none';
$('pub-go').onclick = async () => {
    const targetServer = $('pub-server').checked, targetGithub = $('pub-github').checked;
    const authType = $('auth-pass').checked ? 'password' : 'key';
    if (!targetServer && !targetGithub) return alert('至少选择一个发布目标');
    if (targetServer && authType === 'password' && !$('pub-password').value) return alert('需要填写 SSH 密码');
    if (targetServer && (!$('pub-host').value.trim() || !$('pub-port').value.trim())) return alert('请填写服务器地址和端口');
    saveServerConfig();
    mask.classList.remove('show');
    const r = await post('/api/publish', {
        targetServer, targetGithub,
        password: $('pub-password').value,
        commitMsg: $('pub-commit').value,
        server: {
            host: $('pub-host').value.trim(),
            port: parseInt($('pub-port').value.trim(), 10),
            user: $('pub-user').value.trim(),
            webRoot: $('pub-webroot').value.trim(),
            authType,
            keyFile: $('pub-keyfile').value.trim()
        }
    });
    if (r.error) alert('发布启动失败: ' + r.error);
    $('pub-password').value = '';
};

/* ---------- 初始化 ---------- */
document.querySelectorAll('#sidebar .tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#sidebar .tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentType = b.dataset.type;
    loadList();
});
$('btn-new').onclick = newFile;
$('btn-save').onclick = saveFile;
loadList();
</script>
</body>
</html>
